name: POS collection and reconciliation UI regression
on:
  pull_request:
    paths:
      - 'apps/api/public/app.js'
      - 'scripts/pos-ui-stock-count-regression.test.mjs'
      - '.github/workflows/pos-ui-stock-count-regression.yml'
permissions:
  contents: read
jobs:
  targeted-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/api/public/app.js
      - run: node --test scripts/pos-ui-stock-count-regression.test.mjs
