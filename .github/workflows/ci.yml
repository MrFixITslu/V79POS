name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://v79commerce:test@localhost:5432/v79commerce?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: node --check apps/api/public/app.js
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - name: Build local image for isolated Compose CI
        run: docker build --build-arg NODE_BASE=public.ecr.aws/docker/library/node:22-alpine -t v79pos:latest .

      - name: Validate production Compose stack
        run: |
          cat > .env <<'EOF'
          NODE_ENV=production
          PORT=8080
          POSTGRES_PASSWORD=ci_database_password_2026
          DATABASE_URL=postgresql://v79commerce:ci_database_password_2026@postgres:5432/v79commerce?schema=public
          REDIS_URL=redis://redis:6379
          AUTH_MODE=hub
          JWT_ISSUER=https://hub.v79sl.com
          JWT_AUDIENCE=v79-commerce
          HUB_JWKS_URL=https://hub.v79sl.com/.well-known/jwks.json
          V79_PLATFORM_SHARED_SECRET=ci_platform_shared_secret_0123456789abcdef
          CORS_ORIGINS=https://pos.v79sl.com
          REPLENISHMENT_INTERVAL_MINUTES=60
          LOG_LEVEL=info
          TRUST_PROXY=true
          GIFT_CARD_PEPPER=ci_gift_card_pepper_0123456789abcdef
          ENCRYPTION_KEY=ci_encryption_key_0123456789abcdef012345
          PROXY_NETWORK=proxy_network
          EOF
          docker network inspect proxy_network >/dev/null 2>&1 || docker network create proxy_network
          docker compose -f docker-compose.yml -f ci-compose.override.yml config >/dev/null
          docker compose -f docker-compose.yml -f ci-compose.override.yml up -d --no-build
          for i in $(seq 1 45); do
            if docker compose -f docker-compose.yml -f ci-compose.override.yml exec -T api wget -qO- http://127.0.0.1:8080/ready >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f ci-compose.override.yml ps
          docker compose -f docker-compose.yml -f ci-compose.override.yml logs --no-color api migrate
          exit 1
      - name: Tear down production Compose stack
        if: always()
        run: docker compose -f docker-compose.yml -f ci-compose.override.yml down -v --remove-orphans || true
