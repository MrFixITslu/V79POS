name: v79pos

services:
  postgres:
    image: postgres:17-alpine
    container_name: v79-pos-db
    environment:
      POSTGRES_DB: v79commerce
      POSTGRES_USER: v79commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pos_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v79commerce -d v79commerce"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: v79-pos-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - pos_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: v79pos:latest
    container_name: v79-pos-migrate
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy"]
    networks:
      - pos_internal
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: v79pos:latest
    container_name: v79-pos
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://pos.v79sl.com}
      V79_PLATFORM_SHARED_SECRET: ${V79_PLATFORM_SHARED_SECRET:?V79_PLATFORM_SHARED_SECRET is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["node", "apps/api/dist/server.js"]
    expose:
      - "8080"
    networks:
      pos_internal:
      proxy_network:
        aliases:
          - v79-commerce-api
          - v79-pos
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    image: v79pos:latest
    container_name: v79-pos-worker
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-https://pos.v79sl.com}
      V79_PLATFORM_SHARED_SECRET: ${V79_PLATFORM_SHARED_SECRET:?V79_PLATFORM_SHARED_SECRET is required}
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "apps/api/dist/worker.js"]
    networks:
      - pos_internal
      - proxy_network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

networks:
  pos_internal:
    internal: true
  proxy_network:
    external: true
    name: ${PROXY_NETWORK:-proxy_network}

volumes:
  postgres_data:
    name: v79pos_postgres_data
  redis_data:
    name: v79pos_redis_data
